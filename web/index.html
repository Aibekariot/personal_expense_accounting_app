<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    Базовый путь. Заменяется значением --base-href при `flutter build web`
    (например, для GitHub Pages: --base-href /имя-репозитория/).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Учёт личных доходов и расходов">
  <meta name="theme-color" content="#00897B">

  <!-- iPhone: запуск с экрана «Домой» как отдельное приложение -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Финансы">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Мои финансы</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
